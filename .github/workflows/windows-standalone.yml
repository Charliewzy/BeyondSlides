name: Windows standalone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - src/**
      - packaging/windows/**
      - scripts/package_standalone_windows.ps1
      - scripts/package_installer_windows.ps1
      - scripts/verify_standalone_windows.ps1
      - scripts/verify_installer_windows.ps1
      - .github/workflows/windows-standalone.yml

permissions:
  contents: read

concurrency:
  group: windows-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and verify portable package and installer
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # rust-cache can restore Sherpa's directory marker without the large
      # native archive. Upstream then mistakes the partial directory for a
      # complete prebuilt installation and fails at link time.
      - name: Discard incomplete Sherpa native cache
        shell: pwsh
        run: |
          $sherpaCache = Join-Path $PWD "target\sherpa-onnx-prebuilt"
          if (Test-Path $sherpaCache) {
            $nativeLibrary = Get-ChildItem -Path $sherpaCache -Recurse -File `
              -Filter "sherpa-onnx-c-api.lib" | Select-Object -First 1
            if ($null -eq $nativeLibrary) {
              Write-Host "Removing incomplete Sherpa-ONNX native-library cache."
              Remove-Item -Recurse -Force $sherpaCache
              cargo clean -p sherpa-onnx-sys
              if ($LASTEXITCODE -ne 0) {
                throw "Could not invalidate the incomplete Sherpa-ONNX Cargo cache."
              }
            }
          }
      - name: Run Rust tests
        run: cargo test --locked --all-targets --all-features -- --test-threads=1
      - name: Build standalone package
        shell: pwsh
        run: ./scripts/package_standalone_windows.ps1
      - name: Verify standalone package
        shell: pwsh
        run: ./scripts/verify_standalone_windows.ps1 ./dist/beyond-slides-windows-x86_64
      - name: Build per-user installer
        shell: pwsh
        run: ./scripts/package_installer_windows.ps1
      - name: Verify installer lifecycle
        shell: pwsh
        run: ./scripts/verify_installer_windows.ps1 ./dist/BeyondSlides-Setup-x86_64.exe
      - name: Record package checksum
        shell: pwsh
        run: |
          $archive = Resolve-Path ./dist/beyond-slides-windows-x86_64.zip
          $installer = Resolve-Path ./dist/BeyondSlides-Setup-x86_64.exe
          @($archive, $installer) | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($_))"
          } | Set-Content -Encoding ascii ./dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: beyond-slides-windows-x86_64
          path: |
            dist/beyond-slides-windows-x86_64.zip
            dist/BeyondSlides-Setup-x86_64.exe
            dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
