name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rust-cache can restore Sherpa's directory marker without the large
      # native archive. Upstream then mistakes the partial directory for a
      # complete prebuilt installation and fails at link time.
      - name: Discard incomplete Sherpa native cache
        shell: bash
        run: |
          sherpa_cache=target/sherpa-onnx-prebuilt
          if [[ -d "$sherpa_cache" ]] && \
             ! find "$sherpa_cache" -type f -name 'libsherpa-onnx-c-api.a' -print -quit | grep -q .; then
            echo "Removing incomplete Sherpa-ONNX native-library cache."
            rm -rf -- "$sherpa_cache"
            cargo clean -p sherpa-onnx-sys
          fi
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features -- --test-threads=1

  python:
    name: Lightweight Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/tests/requirements.txt
      - run: python -m unittest discover -s scripts/tests
