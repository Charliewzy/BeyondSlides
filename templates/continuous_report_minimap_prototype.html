<!-- Initialized by the report script; hidden on narrow screens. -->

  <div class="minimap-prototype-stage" data-minimap-stage tabindex="0" aria-label="点击或拖动以浏览整篇讲稿">
    <div class="minimap-prototype-bands" data-minimap-bands></div>

  <div class="minimap-prototype-tooltip" data-minimap-tooltip hidden></div>
