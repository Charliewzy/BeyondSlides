name: Windows standalone

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and verify portable package
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Diagnose Sherpa release linking
        shell: pwsh
        run: |
          cargo build --release --locked --bin beyond-slides -vv
          $status = $LASTEXITCODE
          Write-Host "Sherpa prebuilt cache contents:"
          Get-ChildItem -Recurse -Force target/sherpa-onnx-prebuilt -ErrorAction SilentlyContinue |
            Select-Object FullName, Length
          Write-Host "Sherpa build-script output:"
          Get-ChildItem -Recurse -Force target/release/build -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'sherpa-onnx-sys' } |
            Select-Object FullName, Length
          exit $status
