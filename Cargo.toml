[package]
name = "beyond-slides"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
description = "A local-first Chinese lecture reader with source-backed transcript and slide analysis"
license = "MIT"
repository = "https://github.com/Charliewzy/BeyondSlides"
readme = "README.md"

[dependencies]
async-trait = "0.1"
strip-ansi-escapes = "0.2"
askama = "0.16"
axum = { version = "0.8", features = ["multipart"] }
bzip2 = "0.6"
chromiumoxide = "0.9.1"
colorous = "1"
dirs = "6"
fastembed = { version = "6.0.2", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
flate2 = "1"
fs2 = "0.4"
futures = "0.3"
fastrand = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
image-compare = "0.5"
indicatif = "0.18"
genai = "0.6.5"
httpdate = "1"
jieba-rs = "0.10"
once_cell = "1"
pdfium-render = { version = "0.9.4", default-features = false, features = ["image_025", "pdfium_7881", "thread_safe"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "stream"] }
rapidocr-core = { version = "0.2.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sherpa-onnx = "1.13.7"
similar = "3.2.0"
subtp = "0.2"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "net", "process", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
unicode-normalization = "0.1"
url = "2"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6.5"
